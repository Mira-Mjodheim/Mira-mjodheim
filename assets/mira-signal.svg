<svg width="100%" height="190" viewBox="0 0 1000 190" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1000" y2="190">
      <stop offset="0%" stop-color="#090914"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="2" y="2" width="996" height="186" rx="22" fill="url(#card)" stroke="#7C3AED" stroke-opacity="0.65"/>

  <text x="42" y="48" fill="#9D7DFF" font-family="JetBrains Mono, monospace" font-size="20" font-weight="700">ACTIVE_DOMAINS</text>

  <g font-family="JetBrains Mono, monospace" font-size="15" fill="#E5E7EB">
    <text x="70" y="95">DEVELOP</text>
    <text x="250" y="95">AUTOMATE</text>
    <text x="445" y="95">LEARN</text>
    <text x="610" y="95">PROTECT</text>
    <text x="795" y="95">EVOLVE</text>
  </g>

  <g fill="#9D7DFF" filter="url(#glow)">
    <circle cx="110" cy="125" r="8">
      <animate attributeName="r" values="6;10;6" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="300" cy="125" r="8">
      <animate attributeName="r" values="6;10;6" dur="2.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="485" cy="125" r="8">
      <animate attributeName="r" values="6;10;6" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="660" cy="125" r="8">
      <animate attributeName="r" values="6;10;6" dur="2.9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="845" cy="125" r="8">
      <animate attributeName="r" values="6;10;6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <line x1="110" y1="125" x2="845" y2="125" stroke="#00E5FF" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="8 12">
    <animate attributeName="stroke-dashoffset" values="0;-80" dur="3s" repeatCount="indefinite"/>
  </line>

  <text x="42" y="165" fill="#C7C7D9" font-family="JetBrains Mono, monospace" font-size="13">Code · Systems · Memory · Risk · Iteration</text>
</svg>
